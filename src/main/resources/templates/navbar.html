<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Navbar</title>
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
<div class="navbar" th:fragment="navbar">

    <div class="navbar-left">
        <a th:href="@{/home}">Book inventory</a>
    </div>

    <div class="navbar-right">

        <!-- Books visible to everyone -->
        <a th:href="@{/books}" class="book-link">BOOKS</a>

        <!-- Profile -->
        <div class="profile-section">
            <img th:src="@{/images/generic pp.avif}" class="profile-icon">

            <!-- Guest -->
            <a th:if="${session.user == 'Guest'}"
               th:href="@{/login}" class="profile-text">
               Login/Signup
            </a>

            <!-- Logged in -->
            <span th:if="${session.user != 'Guest'}"
                  th:text="${session.user}"
                  class="profile-text"></span>
        </div>

        <!-- Cart only RegisteredUser -->
        <a th:if="${session.role == 'RegisteredUser'}"
           th:href="@{/cart}" class="cart-link">
           🛒 Cart
        </a>

        <!-- Menu -->
        <div class="dropdown">
            <button>Menu ▼</button>
            <div class="dropdown-content">

                <a th:href="@{/books}">Books</a>

                <!-- StoreOwner + Admin -->
                <a th:if="${session.role == 'StoreOwner' or session.role == 'Admin'}"
                   th:href="@{/inventory}">
                   Inventory
                </a>

                <!-- Admin only -->
                <a th:if="${session.role == 'Admin'}"
                   th:href="@{/reviewers}">
                   Reviewers
                </a>

                <a th:if="${session.role == 'Admin'}"
                   th:href="@{/issues}">
                   Issues
                </a>

                <!-- Logout -->
                <a th:if="${session.user != 'Guest'}"
                   th:href="@{/logout}">
                   Logout
                </a>

            </div>
        </div>

    </div>
</div>
</body>
</html>
